[project]
name = "sabo"
version = "0.1.1"
description = "Static Site Composer written in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Your Name", email="your@email.com" }
]
license = { text = "MIT" }

[project.scripts]
sabo = "sabo.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sabo*"]